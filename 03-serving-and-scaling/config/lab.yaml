schema_version: "1.0.0"

region: us-east-1

aws:
  execution_role_name: LabRole
  bucket_prefix: prb-cloud-ml-lab2

dataset:
  seed: 42
  n_samples: 4000
  n_features: 10
  n_informative: 6
  n_redundant: 2
  label: label
  feature_prefix: f
  split:
    train: 2800
    validation: 600
    test: 600
  async_payload_rows: 50

workloads:
  atendimento:
    nome: "Atendimento humano"
    padrao: realtime
    sla: "resposta síncrona, baixa latência, tráfego contínuo"
  app_fatura:
    nome: "App após fechamento da fatura"
    padrao: serverless
    sla: "rajadas curtas, longos períodos ociosos"
  arquivo_pesado:
    nome: "Importação de arquivo pesado"
    padrao: async
    sla: "não bloqueia o cliente, aceita fila"
  campanha_noturna:
    nome: "Campanha noturna"
    padrao: batch
    sla: "centenas/milhares de registros de uma só vez"

realtime:
  min_capacity: 1
  max_capacity: 2
  target_invocations_per_instance: 60
  scale_out_cooldown_s: 60
  scale_in_cooldown_s: 180

serverless:
  memory_size_in_mb: 2048
  max_concurrency: 5

async:
  min_capacity: 0
  max_capacity: 1
  max_concurrent_invocations_per_instance: 1
  target_backlog_per_instance: 5

batch:
  instance_type: ml.m5.large
  max_concurrent_transforms: 1
  max_payload_in_mb: 1
  batch_strategy: MultiRecord

load_test:
  matrix:
    - concurrency: 1
      requests: 40
    - concurrency: 4
      requests: 80
    - concurrency: 8
      requests: 120
  min_success_rate: 0.99

scale_demo:
  target_min_capacity: 2
  wait_timeout_s: 600

acceptance:
  predictions_tolerance: 1.0e-6
