[project]
name = "lab1-ml-system"
version = "1.0.0"
description = "Lab 1 - From Model to Machine Learning System (Cloud-Based Machine Learning)"
requires-python = "==3.12.*"

dependencies = [
  "boto3==1.43.73",
  "botocore==1.43.73",
  "numpy==2.5.2",
  "scikit-learn==1.9.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
